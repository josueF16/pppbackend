server:
  port: 8081

spring:
  application:
    name: PPPBACKEND


  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: PPP_UPEU
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html



google:
  drive:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: http://localhost:8081/api/v1/google/oauth/callback
    scope: https://www.googleapis.com/auth/drive.file
